<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>One-Click Downloader — Options</title>
    <style>
      body {
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        max-width: 460px;
        color: #1f2937;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 20px;
        color: #6b7280;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 16px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
      }
      .hint {
        color: #6b7280;
        font-size: 12px;
        margin-top: 4px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 22px;
      }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: #4f46e5;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #e5e7eb;
        color: #1f2937;
      }
      #status {
        margin-top: 14px;
        font-size: 13px;
        min-height: 18px;
      }
      .ok {
        color: #16a34a;
      }
      .err {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <h1>One-Click Downloader</h1>
    <p class="sub">Pair this extension with the helper app running on your PC.</p>

    <label for="token">Pairing token</label>
    <input id="token" type="text" placeholder="Paste the token from the app window" />
    <div class="hint">
      Open the One-Click Downloader app → "Browser extension" → click
      <strong>Copy</strong>, then paste it here.
    </div>

    <label for="port">Helper port</label>
    <input id="port" type="number" value="53117" />
    <div class="hint">Leave this unless you changed the port in the app.</div>

    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test connection</button>
    </div>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
