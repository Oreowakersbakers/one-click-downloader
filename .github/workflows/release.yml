name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read and verify release version
        id: version
        shell: pwsh
        run: |
          python scripts/verify-version.py --tag "${{ github.ref_name }}"
          "version=$('${{ github.ref_name }}'.Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Run tests
        run: |
          python -m unittest discover -v
          node --test tests/extension.test.js
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build portable app and extension package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer/OneClickDownloader.iss
      - name: Refresh checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File |
          Where-Object Name -ne "SHA256SUMS.txt" |
          ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --generate-notes --verify-tag
